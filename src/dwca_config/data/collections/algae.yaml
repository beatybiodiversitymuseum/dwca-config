  geographicCoverage:
    description: The strength of the U.B.C. Phycological Collection is primarily in the northeast
      Pacific, where its holdings represent the most comprehensive of any Herbarium. In addition,
      smaller collections made UBC Botanists in Australia, New Zealand, Hawaii, Mauritius,
      East Africa and Japan and frequent exchanges with other institutions have expanded the
      geographic breadth of the Collection.
  taxonomicCoverage:
    description: The algal collection is composed of mainly macroscopic algae, with significant
      representation of seaweeds of the Northeast Pacific Ocean. The collection also includes
      packages of organisms such as diatoms, dinoflagellates, and water moulds. Some blue-green
      algae are also represented.
