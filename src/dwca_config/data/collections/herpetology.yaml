  abstract: The Cowan Tetrapod Collection herpetology holdings of 206 species is principally
    a North American synoptic collection. 84% of the living species known to occur in British
    Columbia are represented. The collection was founded by Dr. Ian McTaggart-Cowan. The herpetology
    collection is housed at the University of British Columbia Beaty Biodiversity Museum,
    which contains approximately 2 million natural history specimens.
