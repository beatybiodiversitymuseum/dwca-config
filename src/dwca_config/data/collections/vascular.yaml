  geographicCoverage:
    description: The UBC Herbarium has one of the world's largest collections of British Columbia
      vascular plants and is worldwide in scope. Of the 235,000 vascular plant specimens,
      about 52% are from British Columbia. About 18% are from the rest of Canada, with the
      Northwest Territories and Yukon especially well represented. Specimens from the United
      States make up about 15% of the collection, with 8% from the five Pacific Coast states
      (California, Hawaii, Oregon, Washington, and Alaska) and 7% from the rest of the United
      States. Hawaiian plants are especially well represented. About 15% of the collection
      is from the rest of the world, with the largest numbers from Great Britain, Finland,
      China, Australia, Denmark, Japan, South Africa, Taiwan, Russia, Greenland, and Sweden.
