  abstract: This dataset includes all digitized vascular plants in the UBC collection, encompassing
    approximately 68% of the collection. The UBC Herbarium has one of the world's largest
    collections of British Columbia vascular plants and is worldwide in scope. At present,
    the collection includes more than 235,000 accessioned specimens.
