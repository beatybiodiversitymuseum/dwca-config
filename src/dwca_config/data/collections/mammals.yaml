  abstract: The Cowan Tetrapod Collection mammal holdings holdings of 540 species in 95 families
    is comprised over 20,000 specimens. Global in scope, the collection is especially strong
    in specimens collected from Western Canada and southern Africa. The collection was founded
    by Dr. Ian McTaggart-Cowan and his father-in-law Kenneth Racey. The mammal collection
    is housed at the University of British Columbia Beaty Biodiversity Museum which contains
    approximately 2 million natural history specimens.
