  abstract: With 40,000 lichen specimens catalogued to date, the UBC Herbarium houses one
    of the largest lichen collections in western North America. We have a very solid macrolichen
    collection, with a strong focus on cyanolichens, especially the genus Peltigera. For this
    genus, at least, this is certainly the largest collection in North America. The collection
    is also strong in Calicioids as well as in other microlichen groups characteristic of
    oldgrowth forests. Taken as a whole, the collection is very strong on epiphytic lichens,
    and rather strong on terricolous lichens, especially macrolichens.
