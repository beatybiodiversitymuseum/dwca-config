  abstract: 'The UBC bryophyte collection houses mosses, liverworts, and hornworts and is
    a tribute to the career of Dr. Wilf Schofield, who came to UBC in 1960. Professor Schofield
    was the first bryologist hired at a Canadian university. When he started at UBC, the collection
    included roughly 3,000 specimens. As a result of Dr. Schofield’s efforts and those of
    his students and post-doctoral researchers, the collection has grown to over 250,000 specimens,
    a considerable legacy. After his retirement, Dr. Schofield continued his research, up
    to the month before his passing in November 2008. He was such an avid collector that his
    specimens will continue to be processed and added to the collection for some time. - See
    more at: http://www.beatymuseum.ubc.ca/herbarium-bryophytes#sthash.pjK2COJK.dpuf'
