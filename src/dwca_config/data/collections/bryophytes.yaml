  geographicCoverage:
    description: 'The major representation is for British Columbia and adjacent states of
      the United States: Alaska, Washington, Oregon, California, and Arizona, in particular.
      Strong representation is also true for the Atlantic provinces of Canada, largely through
      R.J. Belland. For Europe the collection has modest holdings; for Australia and New Zealand
      the collections are representative, but not extensive. The same is true for Japan, Taiwan,
      and the Hawaiian Islands. The lowest representation is for Africa and South America.
      - See more at: http://www.beatymuseum.ubc.ca/herbarium-bryophytes#sthash.pjK2COJK.dpuf'
  taxonomicCoverage:
    description: 'The genera with the most comprehensive representation are: Mosses; Andreaea,
      Grimmia, Hygrohypnum, Hypnum, Hylocomium, Isothecium, Philonotis, Racomitrium, Rhytidiadelphus,
      Sanionia, Schistidium, Sphagnum, Takakia, Tetraphis, Tetrodontium and Hepatics; Anastrophyllum,
      Diplophyllum, Gymnomitrion, Lophozia (s.l.), Marsupella, Plagiochila, Ptilidium, Scapania.
      Type specimens : 220'
