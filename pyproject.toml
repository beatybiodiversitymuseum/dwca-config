[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "dwca-config"
version = "0.4.2"
description = "Darwin Core Archive publication configuration for the Beaty Biodiversity Museum"
readme = "README.md"
requires-python = ">=3.9"
dependencies = ["PyYAML>=6"]
authors = [{ name = "Beaty Biodiversity Museum" }]
keywords = ["biodiversity", "darwin-core", "dwca"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
]

[project.urls]
Repository = "https://github.com/beatybiodiversitymuseum/dwca-config"

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
dwca_config = [
  "py.typed",
  "data/*.yaml",
  "data/collections/*.yaml",
  "templates/*.j2",
]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
